
<!DOCTYPE html>
<html>
<head>
<title>Amar Stream AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Amar Stream AI</h1>

<input id="url" placeholder="Twitch URL">
<input id="alerts" placeholder="More Nutrition, Bitpanda">
<button onclick="start()">Start</button>

<h2>Status</h2>
<div id="status"></div>

<h2>Transcript</h2>
<div id="transcript"></div>

<h2>Summary</h2>
<div id="summary"></div>

<script>

let job
let es

async function start(){

let url=document.getElementById("url").value
let alerts=document.getElementById("alerts").value

let r=await fetch("/api/start",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url,alerts})
})

let d=await r.json()
job=d.job_id

es=new EventSource("/api/events/"+job)

es.onmessage=(e)=>{

let data=JSON.parse(e.data)

if(data.type==="segment"){
let div=document.createElement("div")
div.innerText=data.timestamp+" "+data.text
document.getElementById("transcript").appendChild(div)
}

if(data.type==="summary"){
document.getElementById("summary").innerText=data.text
}

}

poll()
}

async function poll(){

let r=await fetch("/api/status/"+job)
let d=await r.json()

document.getElementById("status").innerText=
"step "+d.step+" percent "+d.percent+" eta "+d.eta

setTimeout(poll,2000)
}
</script>

</body>
</html>
