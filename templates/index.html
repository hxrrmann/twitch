
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Amar Stream AI Platform</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Amar Stream AI Platform</h1>

<input id="url" placeholder="Twitch URL">
<input id="alerts" placeholder="More Nutrition, Bitpanda">
<button onclick="start()">Start</button>

<div id="status"></div>

<script>

let job=null

async function start(){

let url=document.getElementById("url").value
let alerts=document.getElementById("alerts").value

let r=await fetch("/api/start",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url,alerts})
})

let d=await r.json()
job=d.job_id
poll()
}

async function poll(){

if(!job) return

let r=await fetch("/api/status/"+job)
let d=await r.json()

document.getElementById("status").innerText =
"step "+d.step+" percent "+d.percent+" eta "+d.eta

setTimeout(poll,2000)
}

</script>
</body>
</html>
