
<!DOCTYPE html>
<html>
<head>
<title>VOD AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>VOD Transcriber</h1>
<input type="file" id="file">
<button onclick="upload()">Transcribe</button>
<pre id="out"></pre>

<script>
function upload(){
 let f=document.getElementById('file').files[0];
 let fd=new FormData();
 fd.append('file',f);

 fetch('/upload',{method:'POST',body:fd})
 .then(r=>r.json())
 .then(d=>{
 document.getElementById('out').textContent =
 "TRANSCRIPT:\n"+d.transcript+
 "\n\nSPONSOR SIGNALS:\n"+d.sponsors.join(", ")+
 "\n\nSUMMARY:\n"+d.summary;
 });
}
</script>
</body>
</html>
